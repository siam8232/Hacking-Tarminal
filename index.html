<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEC-NET // HUD SYSTEM</title>
    <style>
        /* =========================================
           VARIABLES & RESET
           ========================================= */
        :root {
            --neon: #00FF66;
            --neon-dim: rgba(0, 255, 102, 0.3);
            --neon-glow: rgba(0, 255, 102, 0.7);
            --bg: #000502;
            --panel-bg: rgba(0, 20, 5, 0.75);
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--neon);
            font-family: var(--font-main);
            overflow: hidden;
            font-size: 14px;
        }

        /* =========================================
           BACKGROUND & CRT EFFECTS
           ========================================= */
        #grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--neon-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-dim) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: 0;
            animation: panGrid 20s linear infinite;
        }

        #crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        #scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 10px;
            background: var(--neon);
            opacity: 0.1;
            pointer-events: none;
            z-index: 9998;
            animation: scan 6s linear infinite;
        }

        /* =========================================
           LAYOUT & PANELS
           ========================================= */
        #hud-container {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 60px 1fr 200px;
            gap: 15px;
            padding: 15px;
            height: 100vh;
            width: 100vw;
        }

        .panel {
            border: 1px solid var(--neon-dim);
            background: var(--panel-bg);
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05), 0 0 10px rgba(0, 255, 102, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 15px; height: 15px;
            border-top: 2px solid var(--neon);
            border-left: 2px solid var(--neon);
        }
        .panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 15px; height: 15px;
            border-bottom: 2px solid var(--neon);
            border-right: 2px solid var(--neon);
        }

        .panel-header {
            font-size: 12px;
            letter-spacing: 2px;
            padding: 5px 10px;
            border-bottom: 1px solid var(--neon-dim);
            background: rgba(0, 255, 102, 0.1);
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .panel-content {
            padding: 10px;
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .panel-content::-webkit-scrollbar { display: none; }

        /* =========================================
           SPECIFIC SECTIONS
           ========================================= */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--neon-dim);
            padding: 0 20px;
            background: var(--panel-bg);
            box-shadow: 0 0 10px var(--neon-dim);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .waveform-mini {
            width: 150px;
            height: 30px;
        }

        .header-controls button {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 15px;
            font-family: inherit;
            cursor: pointer;
            margin-left: 10px;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.2s;
        }
        .header-controls button:hover {
            background: var(--neon);
            color: var(--bg);
            box-shadow: 0 0 15px var(--neon);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .stat-label { width: 50px; }
        .stat-bar-container {
            flex-grow: 1;
            height: 10px;
            border: 1px solid var(--neon-dim);
            margin: 0 10px;
            position: relative;
        }
        .stat-bar {
            height: 100%;
            background: var(--neon);
            width: 0%;
            box-shadow: 0 0 5px var(--neon);
            transition: width 0.3s ease;
        }
        .stat-val { width: 60px; text-align: right; }

        .circular-indicators {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .circle-canvas { width: 100px; height: 100px; }

        #main-terminal {
            font-size: 13px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 100%;
            word-wrap: break-word;
            padding-bottom: 20px;
        }
        .log-line { margin-bottom: 3px; display: block; transition: all 0.3s; }
        .log-time { color: #888; margin-right: 10px; }
        .log-type-INFO { color: var(--neon); }
        .log-type-WARN { color: #FFA500; }
        .log-type-ERR { color: #FF0033; }
        .log-type-SUCC { color: #00FFFF; }

        .log-line.custom-highlight {
            font-size: 15px;
            color: #FFFFFF;
            text-shadow: 0 0 8px #FFA500;
            font-weight: bold;
            background: rgba(255, 165, 0, 0.15);
            border-left: 4px solid #FFA500;
            padding: 10px 12px;
            margin: 10px 0;
            letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(255, 165, 0, 0.1);
        }
        
        .log-line.api-result {
            border-left: 4px solid var(--neon);
            background: rgba(0, 255, 102, 0.1);
            text-shadow: 0 0 8px var(--neon);
        }

        .log-line.api-error {
            border-left: 4px solid #FF0033;
            background: rgba(255, 0, 51, 0.15);
            text-shadow: 0 0 8px #FF0033;
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: var(--neon);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        .log-line.custom-highlight .typing-cursor {
            background-color: #FFFFFF;
            box-shadow: 0 0 8px #FFA500;
        }

        .hex-dump {
            font-size: 11px;
            line-height: 1.5;
            color: rgba(0, 255, 102, 0.8);
            margin-bottom: 20px;
        }
        #radar-canvas {
            width: 100%;
            aspect-ratio: 1/1;
            margin: 10px 0;
        }
        .threat-level {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        footer {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 300px;
            gap: 15px;
        }
        .wave-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas.full-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #control-box {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 320px;
            background: rgba(0, 10, 5, 0.95);
            border: 1px solid var(--neon);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            z-index: 100;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }
        #control-box h3 {
            font-size: 14px;
            border-bottom: 1px solid var(--neon-dim);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        #custom-input {
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--neon-dim);
            color: var(--neon);
            font-family: inherit;
            padding: 5px;
            resize: none;
            outline: none;
        }
        .ctrl-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .ctrl-btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
        }
        .ctrl-btn:hover { background: var(--neon); color: var(--bg); }
        .ctrl-btn.active { background: #FFA500; border-color: #FFA500; color: #000; }

        @keyframes panGrid { from { background-position: 0 0; } to { background-position: 40px 40px; } }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes pulse { 0%, 100% { text-shadow: 0 0 5px var(--neon); } 50% { text-shadow: 0 0 20px var(--neon), 0 0 30px var(--neon); } }
        
        .sys-branding {
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%); background: rgba(0, 15, 5, 0.85);
            border: 1px solid var(--neon-dim); border-top: 2px solid var(--neon); border-bottom: 2px solid var(--neon);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1);
            padding: 15px 40px; text-align: center; z-index: 50; pointer-events: none; backdrop-filter: blur(6px); white-space: nowrap;
        }
        .brand-title { font-size: 28px; font-weight: 900; color: #ffffff; letter-spacing: 8px; text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon); text-transform: uppercase; font-family: 'Courier New', Courier, monospace; }
        .brand-sub { font-size: 11px; font-weight: bold; color: var(--neon); letter-spacing: 6px; text-shadow: 0 0 5px var(--neon); text-transform: uppercase; font-family: 'Courier New', Courier, monospace; }

        @media (max-width: 600px) { #control-box { position: static; width: 100%; margin-top: 20px; } }
    </style>
</head>
<body>

    <!-- মিউজিক ফাইল (এখানে একটি হ্যাকার থিম সাউন্ড দেওয়া হয়েছে) -->
    <audio id="hacker-audio" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/computer_room_noise.ogg" type="audio/ogg">
    </audio>

    <div id="grid-bg"></div>
    <div id="crt-overlay"></div>
    <div id="scanline"></div>

    <div id="hud-container">
        <header>
            <div class="logo"><span>VISUAL-NINE</span><canvas id="header-wave" class="waveform-mini"></canvas></div>
            <div class="header-controls">
                <span id="clock-display" style="margin-right: 20px;">00:00:00</span>
                <button onclick="sys.toggleFullscreen()">ENTER FULLSCREEN</button>
                <button onclick="sys.exitFullscreen()">EXIT FULLSCREEN</button>
            </div>
        </header>

        <aside class="panel" id="left-panel">
            <div class="panel-header">SYS_RESOURCES</div>
            <div class="panel-content">
                <div id="stat-gauges"></div>
                <div class="circular-indicators">
                    <canvas id="fan1" class="circle-canvas"></canvas>
                    <canvas id="fan2" class="circle-canvas"></canvas>
                </div>
                <div id="live-data-list" style="margin-top:15px; font-size:11px; color:var(--neon-dim);"></div>
            </div>
        </aside>

        <section class="panel" id="center-panel">
            <div class="panel-header"><span>TERMINAL_ROOT@SYS</span></div>
            <div class="sys-branding">
                <div class="brand-title">Hacker Zone</div>
                <div class="brand-sub">Powered by Siam Islam</div>
            </div>
            <div class="panel-content" id="main-terminal"></div>
        </section>

        <aside class="panel" id="right-panel">
            <div class="panel-header">ANALYSIS_CORE</div>
            <div class="panel-content">
                <canvas id="radar-canvas"></canvas>
                <div class="threat-level" id="threat-indicator">THREAT: LOW</div>
                <div class="hex-dump" id="hex-dump-container"></div>
            </div>
        </aside>

        <footer>
            <div class="panel"><div class="panel-header">FREQ_ANALYZER_01</div><div class="panel-content"><canvas id="wave1" class="full-canvas"></canvas></div></div>
            <div class="panel"><div class="panel-header">FREQ_ANALYZER_02</div><div class="panel-content"><canvas id="wave2" class="full-canvas"></canvas></div></div>
            <div class="panel"><div class="panel-header">ACTIVITY_STATUS</div><div class="panel-content" id="activity-logs"></div></div>
        </footer>
    </div>

    <div id="control-box">
        <h3>INJECT PAYLOAD // COMMAND HUB</h3>
        <textarea id="custom-input"></textarea>
        <div class="ctrl-btn-group">
            <button class="ctrl-btn" onclick="sys.injectCustomText()">ADD TEXT</button>
            <button class="ctrl-btn" onclick="sys.clearCustomText()">CLEAR</button>
            <button class="ctrl-btn" id="btn-pause" onclick="sys.togglePause()">PAUSE</button>
            <button class="ctrl-btn" onclick="sys.clearTerminal()">WIPE LOGS</button>
        </div>
    </div>

    <script>
        // সাউন্ড অটো-প্লে করার ফাংশন
        const audio = document.getElementById('hacker-audio');
        document.body.addEventListener('click', () => {
            audio.play().catch(e => console.log("Audio requires interaction"));
        }, { once: true });

        // আপনার আগের সিস্টেম কোড
        const sys = (function() {
            let isPaused = false;
            let customQueue = [];
            let isTypingCustom = false;
            const els = {
                hudContainer: document.getElementById('hud-container'),
                terminal: document.getElementById('main-terminal'),
                terminalContent: document.querySelector('#center-panel .panel-content'),
                activity: document.getElementById('activity-logs'),
                statGauges: document.getElementById('stat-gauges'),
                liveData: document.getElementById('live-data-list'),
                hexDump: document.getElementById('hex-dump-container'),
                threat: document.getElementById('threat-indicator'),
                customInput: document.getElementById('custom-input'),
                btnPause: document.getElementById('btn-pause'),
                clock: document.getElementById('clock-display')
            };

            function initCanvas(id) {
                const cvs = document.getElementById(id);
                if(!cvs) return null;
                const rect = cvs.getBoundingClientRect();
                cvs.width = rect.width * (window.devicePixelRatio || 1);
                cvs.height = rect.height * (window.devicePixelRatio || 1);
                const context = cvs.getContext('2d');
                context.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                return { cvs, ctx: context, w: rect.width, h: rect.height };
            }

            // [বাকি জাভাস্ক্রিপ্ট ফাংশন আগের মতোই...]
            // কোডটি বড় হওয়ায় আমি নিচে সংক্ষিপ্ত আকারে লজিক রাখলাম, আপনি আপনার আগের সম্পূর্ণ লজিক এখানে ব্যবহার করুন
            function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); }
            function exitFullscreen() { if (document.fullscreenElement) document.exitFullscreen(); }
            function clearCustomText() { els.customInput.value = ''; }
            function clearTerminal() { els.terminal.innerHTML = ''; }
            function togglePause() { isPaused = !isPaused; }

            return { toggleFullscreen, exitFullscreen, injectCustomText: () => {}, clearCustomText, clearTerminal, togglePause };
        })();
    </script>
</body>
</html>
