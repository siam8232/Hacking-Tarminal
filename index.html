<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEC-NET // HUD SYSTEM</title>
    <style>
        /* =========================================
           VARIABLES & RESET
           ========================================= */
        :root {
            --neon: #00FF66;
            --neon-dim: rgba(0, 255, 102, 0.3);
            --neon-glow: rgba(0, 255, 102, 0.7);
            --bg: #000502;
            --panel-bg: rgba(0, 20, 5, 0.75);
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--neon);
            font-family: var(--font-main);
            overflow: hidden;
            font-size: 14px;
        }

        /* =========================================
           BACKGROUND & CRT EFFECTS
           ========================================= */
        #grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--neon-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-dim) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: 0;
            animation: panGrid 20s linear infinite;
        }

        #crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        #scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 10px;
            background: var(--neon);
            opacity: 0.1;
            pointer-events: none;
            z-index: 9998;
            animation: scan 6s linear infinite;
        }

        /* =========================================
           LAYOUT & PANELS
           ========================================= */
        #hud-container {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 60px 1fr 200px;
            gap: 15px;
            padding: 15px;
            height: 100vh;
            width: 100vw;
        }

        .panel {
            border: 1px solid var(--neon-dim);
            background: var(--panel-bg);
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.05), 0 0 10px rgba(0, 255, 102, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 15px; height: 15px;
            border-top: 2px solid var(--neon);
            border-left: 2px solid var(--neon);
        }
        .panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 15px; height: 15px;
            border-bottom: 2px solid var(--neon);
            border-right: 2px solid var(--neon);
        }

        .panel-header {
            font-size: 12px;
            letter-spacing: 2px;
            padding: 5px 10px;
            border-bottom: 1px solid var(--neon-dim);
            background: rgba(0, 255, 102, 0.1);
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .panel-content {
            padding: 10px;
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           SPECIFIC SECTIONS
           ========================================= */
        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--neon-dim);
            padding: 0 20px;
            background: var(--panel-bg);
            box-shadow: 0 0 10px var(--neon-dim);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .waveform-mini {
            width: 150px;
            height: 30px;
        }

        .header-controls button {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 15px;
            font-family: inherit;
            cursor: pointer;
            margin-left: 10px;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.2s;
        }
        .header-controls button:hover {
            background: var(--neon);
            color: var(--bg);
            box-shadow: 0 0 15px var(--neon);
        }

        /* Left Panel - System Stats */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .stat-label { width: 50px; }
        .stat-bar-container {
            flex-grow: 1;
            height: 10px;
            border: 1px solid var(--neon-dim);
            margin: 0 10px;
            position: relative;
        }
        .stat-bar {
            height: 100%;
            background: var(--neon);
            width: 0%;
            box-shadow: 0 0 5px var(--neon);
            transition: width 0.3s ease;
        }
        .stat-val { width: 60px; text-align: right; }

        .circular-indicators {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .circle-canvas { width: 100px; height: 100px; }

        /* Center Panel - Main Terminal */
        #main-terminal {
            font-size: 13px;
            line-height: 1.4;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            word-wrap: break-word;
        }
        .log-line { margin-bottom: 3px; display: block; transition: all 0.3s; }
        .log-time { color: #888; margin-right: 10px; }
        .log-type-INFO { color: var(--neon); }
        .log-type-WARN { color: #FFA500; }
        .log-type-ERR { color: #FF0033; }
        .log-type-SUCC { color: #00FFFF; }

        /* Custom Highlighted Log (NEW FEATURE) */
        .log-line.custom-highlight {
            font-size: 18px;
            color: #FFFFFF;
            text-shadow: 0 0 8px #FFA500, 0 0 15px #FFA500;
            font-weight: bold;
            background: rgba(255, 165, 0, 0.15);
            border-left: 4px solid #FFA500;
            padding: 10px 12px;
            margin: 10px 0;
            letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(255, 165, 0, 0.1);
        }
        .log-line.custom-highlight .log-time {
            color: rgba(255, 255, 255, 0.7);
        }
        .log-line.custom-highlight .log-type-WARN {
            color: #FFFFFF;
            text-shadow: 0 0 5px #FFA500;
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: var(--neon);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        
        .log-line.custom-highlight .typing-cursor {
            background-color: #FFFFFF;
            box-shadow: 0 0 8px #FFA500;
        }

        /* Right Panel - Analysis */
        .hex-dump {
            font-size: 11px;
            line-height: 1.5;
            color: rgba(0, 255, 102, 0.8);
            margin-bottom: 20px;
        }
        #radar-canvas {
            width: 100%;
            aspect-ratio: 1/1;
            margin: 10px 0;
        }
        .threat-level {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        /* Bottom Panel - Activity */
        footer {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr 300px;
            gap: 15px;
        }
        .wave-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas.full-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Floating Custom Control Box */
        #control-box {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 320px;
            background: rgba(0, 10, 5, 0.95);
            border: 1px solid var(--neon);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            z-index: 100;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }
        #control-box:hover { opacity: 1; }
        #control-box h3 {
            font-size: 14px;
            border-bottom: 1px solid var(--neon-dim);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        #custom-input {
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--neon-dim);
            color: var(--neon);
            font-family: inherit;
            padding: 5px;
            resize: none;
            outline: none;
        }
        #custom-input:focus {
            border-color: var(--neon);
            box-shadow: 0 0 5px var(--neon);
        }
        .ctrl-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .ctrl-btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
        }
        .ctrl-btn:hover { background: var(--neon); color: var(--bg); }
        .ctrl-btn.active { background: #FFA500; border-color: #FFA500; color: #000; }

        /* =========================================
           ANIMATIONS
           ========================================= */
        @keyframes panGrid {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 5px var(--neon); }
            50% { text-shadow: 0 0 20px var(--neon), 0 0 30px var(--neon); }
        }

        /* =========================================
           PREMIUM BRANDING
           ========================================= */
        .sys-branding {
            position: absolute;
            top: 35px; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 15, 5, 0.85);
            border: 1px solid var(--neon-dim);
            border-top: 2px solid var(--neon);
            border-bottom: 2px solid var(--neon);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1);
            padding: 15px 40px;
            text-align: center;
            z-index: 50; 
            pointer-events: none; /* Let clicks pass through if logs are behind it */
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: brandPulseGlow 3s infinite alternate;
            white-space: nowrap;
        }

        /* Scanning line effect inside the box */
        .sys-branding::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--neon);
            opacity: 0.5;
            box-shadow: 0 0 10px var(--neon);
            animation: brandScan 3s linear infinite;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 8px;
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            animation: brandTextFlicker 6s infinite;
            font-family: 'Courier New', Courier, monospace;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: bold;
            color: var(--neon);
            letter-spacing: 6px;
            text-shadow: 0 0 5px var(--neon);
            text-transform: uppercase;
            opacity: 0.9;
            font-family: 'Courier New', Courier, monospace;
        }

        @keyframes brandPulseGlow {
            0% { box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px rgba(0, 255, 102, 0.1), inset 0 0 15px rgba(0, 255, 102, 0.05); }
            100% { box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 35px rgba(0, 255, 102, 0.4), inset 0 0 25px rgba(0, 255, 102, 0.2); }
        }

        @keyframes brandTextFlicker {
            0%, 19%, 21%, 100% { opacity: 1; text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon); }
            20% { opacity: 0.4; text-shadow: none; }
        }

        @keyframes brandScan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { top: 100%; opacity: 0; }
        }

        @media (max-width: 992px) {
            .sys-branding { padding: 12px 30px; }
            .brand-title { font-size: 22px; letter-spacing: 6px; }
            .brand-sub { font-size: 10px; letter-spacing: 4px; }
        }

        @media (max-width: 600px) {
            .sys-branding { padding: 10px 20px; }
            .brand-title { font-size: 18px; letter-spacing: 4px; }
            .brand-sub { font-size: 9px; letter-spacing: 3px; }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            #hud-container {
                grid-template-columns: 250px 1fr 250px;
            }
        }
        @media (max-width: 992px) {
            #hud-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto auto;
                overflow-y: auto;
            }
            header { grid-column: 1 / -1; }
            #left-panel { grid-column: 1 / 2; }
            #right-panel { grid-column: 2 / 3; }
            #center-panel { grid-column: 1 / -1; height: 400px; }
            footer { grid-column: 1 / -1; grid-template-columns: 1fr; height: 600px; }
            #control-box { bottom: 10px; right: 10px; width: 280px; }
        }
        @media (max-width: 600px) {
            #hud-container {
                grid-template-columns: 1fr;
                display: flex;
                flex-direction: column;
            }
            .panel { min-height: 300px; }
            #control-box { position: static; width: 100%; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <!-- OVERLAYS -->
    <div id="grid-bg"></div>
    <div id="crt-overlay"></div>
    <div id="scanline"></div>

    <!-- MAIN HUD -->
    <div id="hud-container">
        
        <!-- HEADER -->
        <header>
            <div class="logo">
                <span>VISUAL-NINE</span>
                <canvas id="header-wave" class="waveform-mini"></canvas>
            </div>
            <div class="header-controls">
                <span id="clock-display" style="margin-right: 20px;">00:00:00</span>
                <button id="btn-fs-enter" onclick="sys.toggleFullscreen()">ENTER FULLSCREEN</button>
                <button id="btn-fs-exit" onclick="sys.exitFullscreen()">EXIT FULLSCREEN</button>
            </div>
        </header>

        <!-- LEFT PANEL : SYSTEM STATS -->
        <aside class="panel" id="left-panel">
            <div class="panel-header">SYS_RESOURCES</div>
            <div class="panel-content">
                <div id="stat-gauges">
                    <!-- Populated by JS -->
                </div>
                
                <div class="circular-indicators">
                    <canvas id="fan1" class="circle-canvas"></canvas>
                    <canvas id="fan2" class="circle-canvas"></canvas>
                </div>

                <div style="margin-top:20px;">
                    <div class="panel-header" style="background:transparent; padding:0; border:none; margin-bottom:5px;">LIVE DATA</div>
                    <div id="live-data-list" style="font-size:11px; line-height: 1.6; color:var(--neon-dim);">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- CENTER PANEL : TERMINAL -->
        <section class="panel" id="center-panel">
            <div class="panel-header">
                <span>TERMINAL_ROOT@SYS</span>
                <span id="term-status">STATUS: ACTIVE</span>
            </div>

            <!-- PREMIUM BRANDING -->
            <div class="sys-branding">
                <div class="brand-title">Hacker Zone</div>
                <div class="brand-sub">Powered by Siam Islam</div>
            </div>

            <div class="panel-content" id="main-terminal">
                <!-- Logs injected by JS -->
            </div>
        </section>

        <!-- RIGHT PANEL : ANALYSIS & RADAR -->
        <aside class="panel" id="right-panel">
            <div class="panel-header">ANALYSIS_CORE</div>
            <div class="panel-content">
                <canvas id="radar-canvas"></canvas>
                <div class="threat-level" id="threat-indicator">THREAT: LOW</div>
                
                <div style="margin-top: 15px;">
                    <div class="panel-header" style="background:transparent; padding:0; border:none; margin-bottom:5px;">MEM_DUMP</div>
                    <div class="hex-dump" id="hex-dump-container">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- BOTTOM PANEL : WAVEFORMS & LOGS -->
        <footer>
            <div class="panel">
                <div class="panel-header">FREQ_ANALYZER_01</div>
                <div class="panel-content wave-container">
                    <canvas id="wave1" class="full-canvas"></canvas>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">FREQ_ANALYZER_02</div>
                <div class="panel-content wave-container">
                    <canvas id="wave2" class="full-canvas"></canvas>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">ACTIVITY_STATUS</div>
                <div class="panel-content" id="activity-logs" style="font-size: 11px; line-height: 1.5; overflow: hidden;">
                    <!-- Populated by JS -->
                </div>
            </div>
        </footer>

    </div>

    <!-- CUSTOM CONTROL BOX -->
    <div id="control-box">
        <h3>INJECT PAYLOAD // MANUAL OVERRIDE</h3>
        <textarea id="custom-input" placeholder="Enter custom log data here..."></textarea>
        <div class="ctrl-btn-group">
            <button class="ctrl-btn" onclick="sys.injectCustomText()">ADD TEXT</button>
            <button class="ctrl-btn" onclick="sys.clearCustomText()">CLEAR</button>
            <button class="ctrl-btn" id="btn-pause" onclick="sys.togglePause()">PAUSE</button>
            <button class="ctrl-btn" onclick="sys.clearTerminal()">WIPE LOGS</button>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script>
        /**
         * SEC-NET HUD SYSTEM CORE
         * Handles all logic, animations, and data generation for the terminal.
         */
        const sys = (function() {
            // State
            let isPaused = false;
            let customQueue = [];
            let isTypingCustom = false;
            
            // DOM Elements
            const els = {
                terminal: document.getElementById('main-terminal'),
                activity: document.getElementById('activity-logs'),
                statGauges: document.getElementById('stat-gauges'),
                liveData: document.getElementById('live-data-list'),
                hexDump: document.getElementById('hex-dump-container'),
                threat: document.getElementById('threat-indicator'),
                customInput: document.getElementById('custom-input'),
                btnPause: document.getElementById('btn-pause'),
                clock: document.getElementById('clock-display')
            };

            // Canvas Contexts
            const ctx = {
                headerWave: initCanvas('header-wave'),
                fan1: initCanvas('fan1'),
                fan2: initCanvas('fan2'),
                radar: initCanvas('radar-canvas'),
                wave1: initCanvas('wave1'),
                wave2: initCanvas('wave2')
            };

            // Data Configurations
            const stats = [
                { id: 'CPU', val: 0 }, { id: 'MEM', val: 0 }, 
                { id: 'GPU', val: 0 }, { id: 'SSD', val: 0 },
                { id: 'NET', val: 0 }
            ];

            const liveMetrics = [
                'TEMP', 'VOLT', 'FPS', 'PING', 'UPLINK', 'DWNLINK', 'FIREWALL', 'AI_ACC'
            ];

            const logTypes = ['INFO', 'WARN', 'ERR', 'SUCC'];
            const logMessages = [
                "INITIALIZING KERNEL MODULES...",
                "SCANNING PORT RANGE 0-65535",
                "AUTHENTICATING SECURE HANDSHAKE",
                "ACCESS GRANTED - ROOT PRIVILEGES",
                "ACCESS DENIED - RETRYING...",
                "PACKET RECEIVED FROM UNKNOWN SOURCE",
                "ENCRYPTING DATA STREAM [AES-256]",
                "DECRYPTING PAYLOAD...",
                "LOADING AI NEURAL NET MODULE",
                "FIREWALL ENABLED - STRICT MODE",
                "THREAD CREATED - ID:",
                "LISTENING ON PORT",
                "SYSTEM READY",
                "BYPASSING PROXY SERVER",
                "INJECTING SQL PAYLOAD",
                "EXTRACTING USER HASHES"
            ];

            // Utilities
            function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
            function randFloat(min, max) { return Math.random() * (max - min) + min; }
            function rHex(len=4) { return Math.floor(Math.random()*Math.pow(16,len)).toString(16).toUpperCase().padStart(len,'0'); }
            function rIP() { return `${rand(1,255)}.${rand(0,255)}.${rand(0,255)}.${rand(1,255)}`; }
            function rMAC() { return Array.from({length:6}, ()=>rHex(2)).join(':'); }
            function getTimeStamp() {
                const now = new Date();
                return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${now.getMilliseconds().toString().padStart(3,'0')}`;
            }

            function initCanvas(id) {
                const cvs = document.getElementById(id);
                if(!cvs) return null;
                // Handle high DPI displays
                const rect = cvs.getBoundingClientRect();
                cvs.width = rect.width * (window.devicePixelRatio || 1);
                cvs.height = rect.height * (window.devicePixelRatio || 1);
                const context = cvs.getContext('2d');
                context.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                return { cvs, ctx: context, w: rect.width, h: rect.height };
            }

            window.addEventListener('resize', () => {
                Object.keys(ctx).forEach(k => {
                    if(!ctx[k]) return;
                    const rect = ctx[k].cvs.getBoundingClientRect();
                    ctx[k].cvs.width = rect.width * (window.devicePixelRatio || 1);
                    ctx[k].cvs.height = rect.height * (window.devicePixelRatio || 1);
                    ctx[k].ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                    ctx[k].w = rect.width;
                    ctx[k].h = rect.height;
                });
            });

            // ==========================================
            // FULLSCREEN LOGIC
            // ==========================================
            function toggleFullscreen() {
                const elem = document.documentElement;
                if (!document.fullscreenElement) {
                    if (elem.requestFullscreen) { elem.requestFullscreen(); }
                    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
                    else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
                }
            }

            function exitFullscreen() {
                if (document.fullscreenElement) {
                    if (document.exitFullscreen) { document.exitFullscreen(); }
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                    else if (document.msExitFullscreen) { document.msExitFullscreen(); }
                }
            }

            // prevent exiting fullscreen on random clicks
            document.addEventListener('click', (e) => {
                // native fullscreen doesn't exit on click anyway, but ensure focus is kept
                if (document.fullscreenElement && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            });

            // ==========================================
            // TERMINAL & LOGS LOGIC
            // ==========================================
            function createLogLine(text, type = 'INFO') {
                const div = document.createElement('div');
                div.className = 'log-line';
                div.innerHTML = `<span class="log-time">[${getTimeStamp()}]</span> <span class="log-type-${type}">[${type}]</span> ${text}`;
                return div;
            }

            function appendLog(target, htmlElement, maxLines = 100) {
                target.appendChild(htmlElement);
                while (target.childNodes.length > maxLines) {
                    target.removeChild(target.firstChild);
                }
                target.scrollTop = target.scrollHeight;
            }

            function generateRandomLog() {
                if (isPaused || isTypingCustom) return;
                
                const type = logTypes[rand(0, logTypes.length - 1)];
                let msg = logMessages[rand(0, logMessages.length - 1)];
                
                // Append random data
                const rndData = rand(0,5);
                if(rndData===0) msg += ` ${rIP()}`;
                if(rndData===1) msg += ` ${rMAC()}`;
                if(rndData===2) msg += ` ${rand(1000,9999)}`;
                if(rndData===3) msg += ` 0x${rHex(8)}`;

                appendLog(els.terminal, createLogLine(msg, type), 50);

                // Activity logs (Bottom panel)
                if (rand(0,10) > 6) {
                    const actLine = document.createElement('div');
                    actLine.textContent = `> TRK_${rHex(4)}: ${rIP()} : ${rHex(8)} : OK`;
                    appendLog(els.activity, actLine, 20);
                }
            }

            // ==========================================
            // CUSTOM TEXT INJECTION (TYPING EFFECT)
            // ==========================================
            function injectCustomText() {
                const text = els.customInput.value.trim();
                if (!text) return;
                
                // Split by newlines and add to queue
                const lines = text.split('\n');
                lines.forEach(line => {
                    if(line.trim() !== '') customQueue.push(line);
                });
                
                els.customInput.value = '';
                if (!isTypingCustom) processCustomQueue();
            }

            function clearCustomText() {
                els.customInput.value = '';
            }

            function clearTerminal() {
                els.terminal.innerHTML = '';
                els.activity.innerHTML = '';
                appendLog(els.terminal, createLogLine("SYSTEM LOGS WIPED", "WARN"));
            }

            function togglePause() {
                isPaused = !isPaused;
                els.btnPause.textContent = isPaused ? 'RESUME' : 'PAUSE';
                els.btnPause.classList.toggle('active', isPaused);
            }

            function processCustomQueue() {
                if (customQueue.length === 0 || isPaused) {
                    isTypingCustom = false;
                    return;
                }
                
                isTypingCustom = true;
                const lineText = customQueue.shift();
                
                // Create element for typing (Now with custom-highlight class)
                const lineDiv = document.createElement('div');
                lineDiv.className = 'log-line custom-highlight';
                lineDiv.innerHTML = `<span class="log-time">[${getTimeStamp()}]</span> <span class="log-type-WARN">[USR_OVR]</span> <span class="type-target"></span><span class="typing-cursor"></span>`;
                
                appendLog(els.terminal, lineDiv, 50);
                
                const targetSpan = lineDiv.querySelector('.type-target');
                const cursor = lineDiv.querySelector('.typing-cursor');
                let charIdx = 0;

                function typeChar() {
                    if (isPaused) {
                        setTimeout(typeChar, 100);
                        return;
                    }
                    if (charIdx < lineText.length) {
                        targetSpan.textContent += lineText.charAt(charIdx);
                        charIdx++;
                        els.terminal.scrollTop = els.terminal.scrollHeight;
                        setTimeout(typeChar, rand(20, 60)); // Random typing speed
                    } else {
                        cursor.remove(); // remove cursor when done
                        setTimeout(processCustomQueue, 400); // Wait before next line
                    }
                }
                typeChar();
            }

            // ==========================================
            // DOM UPDATERS (Stats, Hex, Live)
            // ==========================================
            function initDOM() {
                // Init Stat Gauges
                els.statGauges.innerHTML = stats.map(s => `
                    <div class="stat-row">
                        <div class="stat-label">${s.id}</div>
                        <div class="stat-bar-container">
                            <div class="stat-bar" id="bar-${s.id}"></div>
                        </div>
                        <div class="stat-val" id="val-${s.id}">0%</div>
                    </div>
                `).join('');
            }

            function updateDOMStats() {
                if(isPaused) return;

                // Update Left Bars
                stats.forEach(s => {
                    // Smooth random walk
                    s.val += randFloat(-5, 5);
                    if (s.val > 100) s.val = 100;
                    if (s.val < 0) s.val = 0;
                    
                    document.getElementById(`bar-${s.id}`).style.width = `${s.val}%`;
                    document.getElementById(`val-${s.id}`).textContent = `${s.val.toFixed(1)}%`;
                });

                // Update Live Data list
                let liveHTML = '';
                liveMetrics.forEach(m => {
                    const val = (m === 'PING' || m === 'FPS' || m === 'TEMP') ? rand(20, 99) : 
                                (m === 'FIREWALL') ? 'ACTIVE' : rHex(4);
                    liveHTML += `<div style="display:flex; justify-content:space-between;"><span>${m}</span><span>${val}</span></div>`;
                });
                els.liveData.innerHTML = liveHTML;

                // Update Hex Dump
                let hexLines = '';
                for(let i=0; i<8; i++) {
                    hexLines += `0x${rHex(4)}  ${rHex(4)} ${rHex(4)} ${rHex(4)} ${rHex(4)}<br>`;
                }
                els.hexDump.innerHTML = hexLines;

                // Random Threat level change
                if(rand(0,100) > 95) {
                    const threats = ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'];
                    const t = threats[rand(0,3)];
                    els.threat.textContent = `THREAT: ${t}`;
                    els.threat.style.color = (t === 'CRITICAL' || t === 'HIGH') ? '#FF0033' : 'var(--neon)';
                }

                // Update Clock
                const now = new Date();
                els.clock.textContent = now.toLocaleTimeString();
            }


            // ==========================================
            // CANVAS ANIMATIONS
            // ==========================================
            let time = 0;

            function drawRadar(c) {
                if(!c) return;
                const {ctx, w, h} = c;
                const cx = w/2, cy = h/2;
                const r = Math.min(w,h)/2 - 5;

                // Fade trail
                ctx.fillStyle = 'rgba(0, 5, 2, 0.1)';
                ctx.fillRect(0, 0, w, h);

                // Grid circles
                ctx.strokeStyle = 'rgba(0, 255, 102, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let i=1; i<=4; i++) {
                    ctx.arc(cx, cy, r*(i/4), 0, Math.PI*2);
                }
                // Crosshairs
                ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
                ctx.moveTo(0, cy); ctx.lineTo(w, cy);
                ctx.stroke();

                // Sweep
                const angle = time * 2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0, 0, r, 0, 0.2);
                ctx.lineTo(0,0);
                ctx.fillStyle = 'rgba(0, 255, 102, 0.5)';
                ctx.fill();
                ctx.restore();

                // Random blips
                if(rand(0,10) > 8) {
                    const bx = cx + Math.cos(randFloat(0, Math.PI*2)) * randFloat(0, r);
                    const by = cy + Math.sin(randFloat(0, Math.PI*2)) * randFloat(0, r);
                    ctx.fillStyle = '#00FF66';
                    ctx.beginPath();
                    ctx.arc(bx, by, 3, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            function drawWaveform(c, freq, amp, speed, offset) {
                if(!c) return;
                const {ctx, w, h} = c;
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = '#00FF66';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                
                const mid = h/2;
                for(let x=0; x<w; x+=2) {
                    // Combine sine waves and noise
                    let y = Math.sin(x * freq + time * speed + offset) * amp;
                    y += Math.sin(x * freq*2 + time * speed*1.5) * (amp/2);
                    y += (Math.random()-0.5) * 5; // Noise
                    
                    if(x===0) ctx.moveTo(x, mid + y);
                    else ctx.lineTo(x, mid + y);
                }
                ctx.stroke();
            }

            function drawFan(c, offset) {
                if(!c) return;
                const {ctx, w, h} = c;
                const cx = w/2, cy = h/2;
                const r = Math.min(w,h)/2 - 2;

                ctx.clearRect(0,0,w,h);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(time * 3 + offset);

                ctx.strokeStyle = '#00FF66';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI*2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(0, 255, 102, 0.2)';
                for(let i=0; i<3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.arc(0, 0, r, i*(Math.PI*2/3), i*(Math.PI*2/3) + Math.PI/3);
                    ctx.lineTo(0,0);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(0,0, r/4, 0, Math.PI*2);
                ctx.fillStyle = '#00FF66';
                ctx.fill();
                
                ctx.restore();
            }

            function drawHeaderWave(c) {
                if(!c) return;
                const {ctx, w, h} = c;
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#00FF66';
                const bars = 20;
                const bw = w/bars - 2;
                for(let i=0; i<bars; i++) {
                    const bh = (Math.sin(time*5 + i*0.5) * 0.5 + 0.5) * h;
                    ctx.fillRect(i*(bw+2), h-bh, bw, bh);
                }
            }


            // ==========================================
            // MAIN LOOP
            // ==========================================
            let lastLogTime = 0;
            let lastStatTime = 0;

            function loop(timestamp) {
                if(!isPaused) {
                    time += 0.02;

                    // Draw Canvases
                    drawRadar(ctx.radar);
                    drawWaveform(ctx.wave1, 0.02, ctx.wave1?.h/4 || 20, 2, 0);
                    drawWaveform(ctx.wave2, 0.05, ctx.wave2?.h/3 || 30, -3, Math.PI);
                    drawFan(ctx.fan1, 0);
                    drawFan(ctx.fan2, Math.PI);
                    drawHeaderWave(ctx.headerWave);

                    // Throttle DOM updates
                    if (timestamp - lastLogTime > 150) {
                        generateRandomLog();
                        lastLogTime = timestamp;
                    }

                    if (timestamp - lastStatTime > 1000) {
                        updateDOMStats();
                        lastStatTime = timestamp;
                    }
                } else if(isTypingCustom && customQueue.length > 0 && !isPaused) {
                     // If paused but we initiated custom text before pause, it halts. 
                     // Logic is handled in typeChar().
                }

                requestAnimationFrame(loop);
            }

            // Init
            initDOM();
            updateDOMStats();
            requestAnimationFrame(loop);

            // Expose public API
            return {
                toggleFullscreen,
                exitFullscreen,
                injectCustomText,
                clearCustomText,
                clearTerminal,
                togglePause
            };

        })();
    </script>
</body>
</html>
