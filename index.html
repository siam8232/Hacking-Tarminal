<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEC-NET // HUD SYSTEM</title>

    <style>
        /* তোমার আগের সম্পূর্ণ CSS এখানে অপরিবর্তিত */
    </style>
</head>

<body>

    <!-- BACKGROUND HACKING AUDIO -->
    <audio id="hacking-bg-audio" loop preload="auto" playsinline>
        <source src="./hacking-bg.mp3" type="audio/mpeg">
    </audio>

    <!-- তোমার আগের সম্পূর্ণ HTML interface এখানে অপরিবর্তিত -->

    <script>

        /* তোমার আগের সম্পূর্ণ JavaScript এখানে অপরিবর্তিত */

        // BACKGROUND HACKING AUDIO
        const backgroundAudio = document.getElementById('hacking-bg-audio');
        let backgroundAudioStarted = false;

        function startBackgroundAudio() {
            if (!backgroundAudio || backgroundAudioStarted) return;

            backgroundAudio.volume = 0.35;

            const playPromise = backgroundAudio.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    backgroundAudioStarted = true;
                }).catch(() => {
                    // Browser autoplay policy may require a user interaction.
                });
            } else {
                backgroundAudioStarted = true;
            }
        }

        function toggleFullscreen() {
            startBackgroundAudio();

            const elem = document.documentElement;

            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            }
        }

        // Start audio after the first user interaction if autoplay is blocked.
        document.addEventListener('pointerdown', startBackgroundAudio);
        document.addEventListener('keydown', startBackgroundAudio);

        // Try autoplay when the page loads.
        startBackgroundAudio();

    </script>

</body>
</html>
